<!DOCTYPE html>
<html>
<body>

<input type="text" id="primo">
<input type="text" id="secondo">
<button onclick="somma()">Somma</button>
<input type="text" id="terzo">


<p id="demo"></p>

<script>
function somma() {
	let x = parseInt(document.getElementById("primo").value);
	let y = parseInt(document.getElementById("secondo").value);
	document.getElementById("terzo").value = x + y;
}
</script>

</body>
</html>
