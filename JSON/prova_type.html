<!DOCTYPE html>
<html>
  <body>
    <p id="demo"></p>
    <script>

    let x=0;
    let stampa="";
    let xmlhttp = new XMLHttpRequest();
    xmlhttp.open("GET", "https://ppetrozzi.github.io/lavori/JSON/prova.json", true);
    xmlhttp.responseType = "json";
    xmlhttp.send();
    xmlhttp.onreadystatechange = function() {

      if (this.readyState == 4 && this.status == 200) {
          
          let myObj = this.response;

          for (y in myObj) {
            stampa += "<h1>" + myObj[y].nome + "</h1>"

             for (x in myObj[y].auto) {
               stampa +="<h3>" + myObj[y].auto[x].tipo + ": " + myObj[y].auto[x].nome + "</h3>";

            }
          }
        document.getElementById("demo").innerHTML = stampa;

      }

};
  
</script>
</body>
</html>
