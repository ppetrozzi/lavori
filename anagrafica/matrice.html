<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
   
   .cella {
       width:200px;
   }

  </style>

</head>
<body>
<script>

function matrice() {
 const dati = [];
 const indice = [];

let mat = 0;
let vet = 0;
  for(let x=0; i<=mat.length; i++) {
  for(let j=0; j<=vet.length; j++) {
      indice.push(document.getElementById("nome").value)
      indice.push(document.getElementById("cognome").value)
      indice.push(document.getElementById("ind").value)
      indice.push(document.getElementById("citta").value)
 document.getElementById("stampa").innerHTML += "<tr><td>"+indice[j]+"</td><td>"+indice[j]+"</td><td>"+indice[j]+"</td><td>"+indice[j]+"</td></tr>"; 
dati[i].push(indice);
  } 
   

   document.getElementById("nome").value="";
   document.getElementById("cognome").value="";
   document.getElementById("ind").value="";
   document.getElementById("citta").value="";
 }

 document.getElementById("stampa").innerHTML += "<tr><td>"+indice[0]+"</td><td>"+indice[1]+"</td><td>"+indice[2]+"</td><td>"+indice[3]+"</td></tr>"; 

localStorage.setItem("ana", dati);

}
</script>
<div style="float:left; margin-left:20px;">
  <label for="fname" style="width:80px;">Nome:</label>
  <input type="text" id="nome"><br>
  <label for="fname" style="width:80px;">Cognome:</label>
  <input type="text" id="cognome"><br>
  <label for="fname" style="width:80px;">Indirizzo:</label>
  <input type="text" id="ind"><br>
  <label for="fname" style="width:80px;">Città:</label>
  <input type="text" id="citta"><br>

  <button onclick="matrice()">ok</button>
</div>
<div style="float:left">
  <table id="stampa" class="table table-bordered" style="margin-left:20px; width:auto;">
    <th class="cella">Nome</th>
    <th class="cella">Cognome</th>
    <th class="cella">Indirizzo</th>
    <th class="cella">Città</th>
  </table>
</div>

</html>
