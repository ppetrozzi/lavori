<!DOCTYPE html>
<html>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.js"></script>

<body ng-app="myApp">

<p><a href="#!/">Main</a></p>

<a href="#!red">Red</a>
<a href="#!green">Green</a>
<a href="#!blue">Blue</a>

<div ng-view></div>

<script>

var app = angular.module("myApp", ["ngRoute"]);
app.config(function($routeProvider) {
    $routeProvider
    .when("/", {
        templateUrl : "main.html"
    })
    .when("/red", {
        templateUrl : "leggi_costumer.html",
		controller : "leggi"
    })
    .when("/green", {
        templateUrl : "green.html",
		controller : "greenCtrl"
    })
    .when("/blue", {
        templateUrl : "blue.html",
		controller : "blueCtrl",
		controller : "greenCtrl"
    });
});

app.controller("blueCtrl", function ($scope) {
  $scope.msg = "mio colore preferito";
  
});

app.controller("leggi", function($scope, $http) {
    $http.get("customers.json")
    .then(function (response) {$scope.names = response.data.records;});
});

app.controller('greenCtrl', function($scope) {
  $scope.inserisci = function(name,cognome) {
    $scope.jsonizzato = angular.toJson({"nome" : name , "cognome" : cognome});
  }
});
</script>

</body>
</html>
