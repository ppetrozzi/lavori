<!DOCTYPE html>
<html>
    <head>
        <title>localStorage</title>
     <!--   <script src="script.js"></script> -->
    </head>
    <body>
        <input type="text" id="nome">
        <input type="text" id="cognome">
        <input type="button" value="inserisci" onclick="ana()">

    <script>
        let n = "";
        let c = "";
        let ele = []; 
        
        function ana() {

            localStorage.getItem("elenco");

            n = document.getElementById("nome").value;
            c = document.getElementById("cognome").value;

            const persone = {}
            persone.nome = n;
            persone.cognome = c;

            ele.push(persone); 


            localStorage.setItem("elenco", JSON.stringify(ele)); 
        }
   
    </script>

    <a href="stampa.html">Stampa</a>
    </body>
</html>
